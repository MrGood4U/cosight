name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: harness/go.mod
          cache-dependency-path: harness/go.sum

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Run Electron, Go, and session integration tests
        run: npm test

      - name: Run Go vet
        shell: pwsh
        working-directory: harness
        run: go vet ./...

      - name: Build renderer
        run: npm run build

      - name: Build Go Harness
        run: npm run build:harness

      - name: Build Windows Process Loopback helper
        run: npm run build:system-audio

      - name: Upload CI build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cosight-ci-build
          if-no-files-found: ignore
          path: |
            dist
            build/harness
            build/system-audio
